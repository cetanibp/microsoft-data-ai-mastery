name: Skill work item
description: A bounded build, design, research, assessment, or documentation task
title: ""
body:
  - type: dropdown
    id: work_type
    attributes:
      label: Work type
      options: [Build, Design, Research, Assessment, Documentation]
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the measurable result, not the learning activity.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Implementation or analysis is complete
        - [ ] Happy path is verified
        - [ ] Failure paths are tested
        - [ ] Architecture and tradeoffs are documented
        - [ ] Security, operations, and cost impacts are considered
        - [ ] Evidence links are added
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence produced
      description: Link code, tests, diagrams, ADRs, dashboards, demos, or reports.
  - type: textarea
    id: retrospective
    attributes:
      label: Retrospective
      description: Complete before closing—what worked, what failed, and what changes next.

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and increments
      description: Link one parent epic and milestone; distinguish prerequisite increments, shared integration gates, and optional extensions. Split work that exceeds two weeks.
  - type: textarea
    id: validation_design
    attributes:
      label: Validation and learning depth
      description: Define expected behavior, failure scenarios, metrics and thresholds before tuning. For AI, include versioned datasets and held-out cases. State the evidence needed for any proposed score change.
  - type: textarea
    id: limitations
    attributes:
      label: Evidence boundaries and limitations
      description: Distinguish planned work, artifact checks, live lab behavior, simulations and independent review. Record platform/version/access limitations and open follow-ups.
